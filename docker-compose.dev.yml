# Local development database only. Production PostgreSQL runs on Railway.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: co_dev
      POSTGRES_USER: co
      POSTGRES_PASSWORD: co_local_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - co_pg:/var/lib/postgresql/data
  # S3-compatible storage for local uploads (production uses AWS S3 or Cloudflare R2).
  storage:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - co_storage:/data
      - ./infra/dev/s3.json:/etc/seaweedfs/s3.json:ro
volumes:
  co_pg:
  co_storage:
