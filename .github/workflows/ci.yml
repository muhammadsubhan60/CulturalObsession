name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cultural_obsession
          POSTGRES_USER: co
          POSTGRES_PASSWORD: co_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U co"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://co:co_ci@localhost:5432/cultural_obsession?schema=public
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Start S3-compatible storage (SeaweedFS)
        run: |
          docker run -d --name storage -p 8333:8333 \
            -v "$PWD/infra/dev/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:latest server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8333/ && break; sleep 2; done
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @co/db generate
      - run: pnpm --filter @co/db migrate:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke-test the built API (catches bundling problems tests cannot see)
        run: |
          cd apps/api
          PORT=4100 API_URL=http://127.0.0.1:4100 WEB_ORIGIN=http://127.0.0.1:3000 node dist/index.js &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4100/health && exit 0; sleep 1; done
          exit 1
      - name: Browser tests (storefront order → admin confirm)
        env:
          CI: '1'
          API_URL: http://localhost:4000
          WEB_ORIGIN: http://localhost:3000
        run: |
          (cd apps/api && PORT=4000 node dist/index.js > /tmp/api.log 2>&1 &)
          (cd apps/web && pnpm start > /tmp/web.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:4000/health >/dev/null && curl -sf -o /dev/null http://localhost:3000/admin/login && break; sleep 2; done
          pnpm --filter @co/e2e e2e
      - name: Keep browser test traces and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            e2e/test-results
            /tmp/api.log
            /tmp/web.log
          retention-days: 7
